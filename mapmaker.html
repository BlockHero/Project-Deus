<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Editor</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text: #e0e0e0;
            --border: #333;
        }

        body {
            font-family: system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        #workspace {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            overflow: auto;
        }

        canvas {
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: crosshair;
            image-rendering: pixelated;
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Coordinate Display */
        #coordDisplay {
            font-family: monospace;
            font-size: 0.9rem;
            color: #00ffcc;
            background: #111;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .tool-group {
            margin-bottom: 20px;
        }

        .tile-btn {
            display: flex;
            align-items: center;
            width: 100%;
            background: transparent;
            border: 2px solid transparent;
            color: var(--text);
            padding: 8px;
            margin-bottom: 5px;
            cursor: pointer;
            border-radius: 4px;
            text-align: left;
            font-size: 14px;
        }

            .tile-btn.active {
                background: #2a2a2a;
                border-color: #00ffcc;
            }

        .color-box {
            width: 24px;
            height: 24px;
            margin-right: 10px;
            border: 1px solid #000;
            border-radius: 3px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #000;
            color: #00ffcc;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            resize: none;
            box-sizing: border-box;
            white-space: pre;
            overflow: auto;
        }

        button.action-btn {
            width: 100%;
            padding: 10px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

            button.action-btn:hover {
                background: #00e6b8;
            }

            button.action-btn.secondary {
                background: #444;
                color: #fff;
            }

                button.action-btn.secondary:hover {
                    background: #555;
                }

        /* Grid Toggle */
        .checkbox-row {
            display: flex;
            align-items: center;
            font-size: 14px;
            margin-bottom: 20px;
            cursor: pointer;
        }

            .checkbox-row input {
                margin-right: 8px;
            }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Palette <span id="coordDisplay">X: --, Y: --</span></h2>
        <div class="tool-group" id="palette">
            <button class="tile-btn" data-type="0">
                <div class="color-box" style="background-color: #58b25a;"></div> 0 - Park
            </button>
            <button class="tile-btn" data-type="1">
                <div class="color-box" style="background-color: #2f2f2f;"></div> 1 - Building
            </button>
            <button class="tile-btn" data-type="2">
                <div class="color-box" style="background-color: #bfbfbf;"></div> 2 - Road
            </button>
            <button class="tile-btn active" data-type="3">
                <div class="color-box" style="background-color: #1da3ff;"></div> 3 - Water
            </button>
        </div>

        <label class="checkbox-row">
            <input type="checkbox" id="showGrid" checked> Show Grid
        </label>

        <h2>Data</h2>
        <div class="tool-group" style="flex-grow: 1; display: flex; flex-direction: column;">

            <button class="action-btn secondary" onclick="importData()">Import Map</button>
            <textarea id="ioBox" spellcheck="false"></textarea>
        </div>
    </div>

        let activeTile = 3;
        let isDrawing = false;
        const gridCheckbox = document.getElementById('showGrid');

        document.querySelectorAll('.tile-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tile-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeTile = parseInt(btn.getAttribute('data-type'));
            });
        });

        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let y = 0; y < MAP_SIZE; y++) {
                for (let x = 0; x < MAP_SIZE; x++) {
                    const tile = mapData[y * MAP_SIZE + x];
                    ctx.fillStyle = colors[tile] || '#000';
                    ctx.fillRect(x * TILE_PX, y * TILE_PX, TILE_PX, TILE_PX);

                    if (gridCheckbox.checked) {
                        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                        ctx.strokeRect(x * TILE_PX, y * TILE_PX, TILE_PX, TILE_PX);
                    }
                }
            }
        }

        gridCheckbox.addEventListener('change', drawMap);

        function updateCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / TILE_PX);
            const y = Math.floor((e.clientY - rect.top) / TILE_PX);

            if (x >= 0 && x < MAP_SIZE && y >= 0 && y < MAP_SIZE) {
                coordDisplay.textContent = `X: ${x}, Y: ${y}`;
                return { x, y };
            }

            coordDisplay.textContent = `X: --, Y: --`;
            return null;
        }

        function paintTile(e) {
            const coords = updateCoords(e);
            if (coords) {
                const index = coords.y * MAP_SIZE + coords.x;
                if (mapData[index] !== activeTile) {
                    mapData[index] = activeTile;
                    drawMap();
                }
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            paintTile(e);
        });

        window.addEventListener('mouseup', () => isDrawing = false);

        canvas.addEventListener('mousemove', (e) => {
            updateCoords(e); // Always update coordinates on hover
            if (isDrawing) paintTile(e); // Only paint if mouse is down
        });

        canvas.addEventListener('mouseleave', () => {
            coordDisplay.textContent = `X: --, Y: --`;
        });

        function exportData() {
            let output = "const map = new Uint8Array([\n";
            for (let y = 0; y < MAP_SIZE; y++) {
                let row = [];
                for (let x = 0; x < MAP_SIZE; x++) {
                    row.push(mapData[y * MAP_SIZE + x]);
                }
                output += "    " + row.join(", ") + (y === MAP_SIZE - 1 ? "\n" : ",\n");
            }
            output += "]);";

            document.getElementById('ioBox').value = output;
        }

        function importData() {
            try {
                let text = document.getElementById('ioBox').value;
                let matches = text.match(/\[([\s\S]*?)\]/);
                if (!matches) throw new Error("Could not find array format.");

                let nums = matches[1].replace(/\n/g, '').split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));

                if (nums.length !== MAP_SIZE * MAP_SIZE) {
                    alert(`Invalid size. Expected ${MAP_SIZE * MAP_SIZE} values, got ${nums.length}`);
                    return;
                }

                for (let i = 0; i < nums.length; i++) {
                    mapData[i] = nums[i];
                }
                drawMap();
                alert("Map imported successfully.");
            } catch (e) {
                alert("Import failed. Ensure the format matches the exported array.");
            }
        }

        drawMap();
    </script>
